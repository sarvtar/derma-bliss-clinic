server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index login.html index.html dashboard.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA / HTML fallback
    location / {
        try_files $uri $uri/ /login.html;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://dermabliss-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

