<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagonal Ring -->
    <circle cx="30" cy="30" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="30" cy="30" r="25" fill="#FAF7F2" stroke="url(#goldGrad)" stroke-width="1.8"/>
    
    <!-- Stylized Lotus / Radiant Petals -->
    <path d="M30 14 C33 22 41 26 41 33 C41 40 30 45 30 45 C30 45 19 40 19 33 C19 26 27 22 30 14 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <path d="M30 20 C32 25 37 28 37 33 C37 38 30 42 30 42 C30 42 23 38 23 33 C23 28 28 25 30 20 Z" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Central Diamond Sparkle -->
    <polygon points="30,26 32,30 30,34 28,30" fill="url(#goldGrad)" />
    
    <!-- Bottom Arch Accent -->
    <path d="M22 37 Q30 42 38 37" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(78, 20)">
    <!-- Tagline / Subtitle -->
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#9A7B38" letter-spacing="2.8">SKIN &bull; HAIR &bull; LASER</text>
    
    <!-- Main Clinic Title -->
    <text x="0" y="30" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#1A1615" letter-spacing="0.5">Derma Bliss</text>
    
    <!-- Doctor Qualification & Reg Line -->
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#6B5E59" letter-spacing="0.4">
      Dr. Ankita Santosh Koli <tspan fill="#C5A059">&bull;</tspan> Reg. 73892
    </text>
  </g>
</svg>
