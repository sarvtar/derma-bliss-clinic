services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot 3 Backend API (Render Free Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: dermabliss-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: free
      - key: DERMABLISS_JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_PHONE
        value: "+917897892177"
      - key: ADMIN_BOOTSTRAP_PASSWORD
        value: "ChangeMeInProdDoctor2026!"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dermabliss-admin.onrender.com,http://localhost:3000,http://localhost:8080"

  # ----------------------------------------------------------------------------
  # 2. Admin Website (Render Free Static Site on Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: dermabliss-admin
    runtime: static
    buildCommand: ""
    staticPublishPath: ./admin-website
    routes:
      - type: rewrite
        source: /api/*
        destination: https://dermabliss-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /login.html
