# ==============================================================================
# Derma Bliss Clinic — Render Infrastructure Blueprint (render.yaml)
# One-click deployment for MySQL, Spring Boot 3 Backend, and Admin Website
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8.0 Database (Private Service with Persistent Disk)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: dermabliss-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    plan: starter
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: dermabliss_db
      - key: MYSQL_USER
        value: dermabliss_user
      - key: MYSQL_PASSWORD
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. Spring Boot 3 Backend API (Auto-scaling Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: dermabliss-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    healthCheckPath: /actuator/health
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 5
      targetCPUPercent: 75
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://dermabliss-mysql:3306/dermabliss_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: dermabliss_user
      - key: SPRING_DATASOURCE_PASSWORD
        fromService:
          name: dermabliss-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: DERMABLISS_JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_PHONE
        value: "+917897892177"
      - key: ADMIN_BOOTSTRAP_PASSWORD
        value: "ChangeMeInProdDoctor2026!"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dermabliss-admin.onrender.com,http://localhost:3000,http://localhost:8080"

  # ----------------------------------------------------------------------------
  # 3. Admin Website (Static Site on Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: dermabliss-admin
    runtime: static
    buildCommand: ""
    staticPublishPath: ./admin-website
    routes:
      - type: rewrite
        source: /api/*
        destination: https://dermabliss-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /login.html
