spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:dermabliss_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.dermabliss.clinic: INFO
